<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrahancito</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #fff; }
        #game-container {
            position: relative;
            border: 6px solid #ffd700;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            aspect-ratio: 800 / 500;
            background: linear-gradient(180deg, #87CEEB 0%, #90EE90 50%, #8B7355 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }
        #dialog-box {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            display: none;
            color: #fff;
            z-index: 10;
        }
        .info { margin-top: 15px; font-size: 0.9rem; color: #fff; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }
        .mobile-controls { display: none; gap: 10px; margin-top: 15px; width: 100%; max-width: 800px; flex-direction: column; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }
        .dpad button { background: #667eea; border: 3px solid #ffd700; color: white; font-size: 1.5rem; border-radius: 10px; cursor: pointer; }
        .dpad button:nth-child(2) { grid-column: 2; grid-row: 1; }
        .dpad button:nth-child(4) { grid-column: 1; grid-row: 2; }
        .dpad button:nth-child(5) { grid-column: 2; grid-row: 2; visibility: hidden; }
        .dpad button:nth-child(6) { grid-column: 3; grid-row: 2; }
        .dpad button:nth-child(8) { grid-column: 2; grid-row: 3; }
        .btns { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        .btns button { background: #667eea; color: white; border: 3px solid #ffd700; padding: 12px 20px; border-radius: 8px; cursor: pointer; }
        .btns button.reset { background: #f5576c; }
    </style>
</head>
<body>
    <h1>🤠 Abrahancito 🤠</h1>
    <div class="info">👿 Enemigos: <span id="enemyCount">2</span> | 💪 Derrotados: <span id="defeatedCount">0</span></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="dialog-box">
            <strong id="npc-name" style="color: #ffd700;"></strong>
            <p id="npc-text" style="margin: 8px 0 0 0;"></p>
        </div>
    </div>
    <div class="info" id="desktop-info">⚔️ Choca con enemigos para derrotarlos | E = Hablar</div>
    <div class="mobile-controls" id="mobileControls">
        <div class="dpad">
            <button id="btnUp">↑</button>
            <button id="btnLeft">←</button>
            <button id="btnRight">→</button>
            <button id="btnDown">↓</button>
        </div>
    </div>
    <div class="btns">
        <button onclick="saveGame()">💾 Guardar</button>
        <button class="reset" onclick="resetGame()">🔄 Reiniciar</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent);
        if (isMobile) document.getElementById('mobileControls').style.display = 'flex';

        let player = { x: 100, y: 400, emoji: '🤠' };
        let villains = [
            { x: 400, y: 250, emoji: '👿', defeated: false },
            { x: 300, y: 350, emoji: '🤡', defeated: false }
        ];
        let defeated = 0;
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        if (isMobile) {
            ['btnUp', 'btnDown', 'btnLeft', 'btnRight'].forEach(id => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', e => { e.preventDefault(); keys[{btnUp: 'w', btnDown: 's', btnLeft: 'a', btnRight: 'd'}[id]] = true; });
                btn.addEventListener('touchend', e => { e.preventDefault(); keys[{btnUp: 'w', btnDown: 's', btnLeft: 'a', btnRight: 'd'}[id]] = false; });
            });
        }

        function update() {
            if (keys['arrowup'] || keys['w']) player.y -= 3;
            if (keys['arrowdown'] || keys['s']) player.y += 3;
            if (keys['arrowleft'] || keys['a']) player.x -= 3;
            if (keys['arrowright'] || keys['d']) player.x += 3;

            player.x = Math.max(0, Math.min(760, player.x));
            player.y = Math.max(0, Math.min(460, player.y));

            villains.forEach(v => {
                if (!v.defeated && Math.hypot(player.x - v.x, player.y - v.y) < 50) {
                    v.defeated = true;
                    defeated++;
                    document.getElementById('defeatedCount').textContent = defeated;
                    document.getElementById('enemyCount').textContent = villains.filter(x => !x.defeated).length;
                }
            });
        }

        function draw() {
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, 0, 800, 500);
            
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            const trees = [[50, 100], [750, 80], [150, 450], [700, 420], [600, 100]];
            trees.forEach(t => ctx.fillText('🌳', t[0], t[1]));
            
            [[550, 350], [450, 450], [250, 380]].forEach(d => ctx.fillText('⛺', d[0], d[1]));
            [[200, 150], [500, 380], [650, 200]].forEach(p => ctx.fillText('🧙‍♂️', p[0], p[1]));
            
            villains.forEach(v => {
                if (!v.defeated) ctx.fillText(v.emoji, v.x, v.y);
            });
            
            ctx.font = '50px Arial';
            ctx.fillText(player.emoji, player.x, player.y);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function saveGame() {
            localStorage.setItem('abrahancito', JSON.stringify({x: player.x, y: player.y, defeated}));
            alert('Guardado! 💾');
        }

        function resetGame() {
            localStorage.removeItem('abrahancito');
            player = { x: 100, y: 400, emoji: '🤠' };
            villains.forEach(v => v.defeated = false);
            defeated = 0;
            document.getElementById('defeatedCount').textContent = '0';
            document.getElementById('enemyCount').textContent = '2';
        }

        const saved = JSON.parse(localStorage.getItem('abrahancito') || '{}');
        if (saved.x) {
            player.x = saved.x;
            player.y = saved.y;
            defeated = saved.defeated || 0;
            document.getElementById('defeatedCount').textContent = defeated;
        }

        gameLoop();
    </script>
</body>
</html>
